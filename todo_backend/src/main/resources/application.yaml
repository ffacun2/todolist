server:
  port: 8080

spring:
  application:
    name: ${APPLICATION_NAME:Backend TodoList}
  datasource:
    url: ${MYSQL_PUBLIC_URL}
    username: ${MYSQLUSER}
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update